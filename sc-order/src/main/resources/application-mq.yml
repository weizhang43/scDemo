spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    # 连接池配置
    listener:
      simple:
        # 消费者并发数
        concurrency: 5
        max-concurrency: 10
        # 手动确认模式
        acknowledge-mode: manual
        # 每次预取消息数，避免消息积压
        prefetch: 10
        # 重试机制
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
        default-requeue-rejected: false
    # 生产者确认
    publisher-confirm-type: correlated
    publisher-returns: true
    # 连接超时时间
    connection-timeout: 15000ms

# RocketMQ：消费 sc-pay 的支付通知消息
# 与 sc-pay 配置共用同一 name-server 才能投递/消费对端消息
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  # sc-order 仅为消费方，但 rocketmq-spring-boot-starter 要求 producer.group 必填，
  # 这里给个占位组名，本模块不主动发送 RocketMQ 消息
  producer:
    group: sc-order-rocketmq-producer-placeholder
    send-message-timeout: 3000

