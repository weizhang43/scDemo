# Tomcat
server:
  port: 8001
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    context-path: /sc-order
# Spring
spring:
  application:
    # 应用名称
    name: sc-order
  # 数据库连接池：三服务共用同一 MySQL 实例，显式设定避免默认 10 连接在高峰期争抢
  datasource:
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
  profiles:
    # 环境配置
    active: test
    include: mq
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: localhost:8848
      config:
        # 配置中心地址
        server-addr: localhost:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
    sentinel:
      enabled: true
      transport:
        dashboard: localhost:8858
        port: 8719
  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 0

# Redisson
redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      database: 0
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32
      idleConnectionTimeout: 10000
      connectTimeout: 3000
      timeout: 3000

# 服务间内部调用令牌（定时任务/MQ 消费等无用户上下文场景），需与 sc-product 配置一致
inner:
  auth:
    token: ${SC_INNER_TOKEN:sc-inner-token-dev}

