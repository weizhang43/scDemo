# Tomcat
server:
  port: 8000
# Spring
spring:
  application:
    # 应用名称
    name: sc-gateway
  profiles:
    # 环境配置
    active: test
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: localhost:8848
      config:
        # 配置中心地址
        server-addr: localhost:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - data-id: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
    gateway:
      # 路由配置
      routes:
        # 用户服务
        - id: sc-user
          uri: lb://sc-user
          predicates:
            - Path=/user/**
        # 订单服务
        - id: sc-order
          uri: lb://sc-order
          predicates:
            - Path=/order/**
        # 商品服务
        - id: sc-product
          uri: lb://sc-product
          predicates:
            - Path=/product/**
        # 模拟支付网关
        - id: sc-pay
          uri: lb://sc-pay
          predicates:
            - Path=/pay/**
      # 跨域配置
      default-filters:
        - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
  # Redis：网关侧校验 token 存活与滑动续期
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 2000ms

