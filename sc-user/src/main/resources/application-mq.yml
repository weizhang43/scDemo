# RabbitMQ 消费开关：dev 环境有 RabbitMQ → true；test 环境无 → false，跳过 OperationLogMqListener
# 由父 pom 的 Maven profile 属性 @rabbitmq.consumer.enabled@ 在构建时注入
rabbitmq:
  consumer:
    enabled: @rabbitmq.consumer.enabled@
# 操作日志 sink：mq → 走 RabbitMQ（dev）；feign → 走 Feign 转发（test 无 RabbitMQ）
# 由父 pom 的 Maven profile 属性 @op-log-sink@ 在构建时注入；sc-user 自身有 DbOperationLogSink 直接落库
op-log:
  sink: @op-log-sink@
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    listener:
      simple:
        # 消费者并发数：操作日志 QPS 不高，2 个并发足够
        concurrency: 2
        max-concurrency: 5
        # 手动确认模式：消费失败 NACK 不 requeue，触发 retry 重试 3 次后死信
        acknowledge-mode: manual
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
        default-requeue-rejected: false
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 15000ms
