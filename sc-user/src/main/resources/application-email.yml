spring:
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:1602043766@qq.com}
    password: ${MAIL_AUTH_CODE:}  # QQ 邮箱授权码，从环境变量读取，禁止写进仓库
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          # 发信是同步阻塞调用，/user/sendEmailCode 又在网关白名单内，
          # 不设超时会在 SMTP 不可用时耗尽请求线程
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          starttls:
            enable: false